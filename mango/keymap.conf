# application
bind=SUPER+SHIFT,P,spawn,$HOME/.local/bin/foots
bind=SUPER+SHIFT,W,spawn,$HOME/.local/bin/waybar-switch mango
bind=SUPER,X,spawn,pgrep xremap && echo 0411 | sudo -S pkill xremap || echo 0411 | sudo -S -E xremap --watch=config,device /home/harunato/.config/xremap/config.yml
bind=SUPER,T,spawn,footclient
bind=SUPER,Return,toggle_named_scratchpad,floatterm,none,footclient -a floatterm tmux new-session -A
bind=SUPER,M,spawn,thunderbird
bind=SUPER,B,spawn,firefox
bind=SUPER+SHIFT,B,spawn,firefox --private-window
bind=SUPER,Backspace,spawn,footclient btop
bind=SUPER,S,spawn,footclient calcurse

# wmenu tweeks
bind=Alt,Space,spawn,$HOME/.local/bin/wmenu-run-color
bind=Shift+Alt,E,spawn,$HOME/.local/bin/wmenu-edit
bind=Shift+Alt,C,spawn,$HOME/.local/bin/wmenu-clip
bind=Shift+Alt,S,spawn,$HOME/.local/bin/wmenu-search
bind=Shift+Alt,B,spawn,$HOME/.local/bin/wmenu-bookmark
bind=Shift+Alt,W,spawn,$HOME/.local/bin/sway-wallpaper
bind=Shift+Alt,P,spawn,$HOME/.local/bin/wmenu-session
bind=Shift+Alt,K,spawn,$HOME/.local/bin/wmenu-kill
bind=Shift+Alt,V,spawn,$HOME/.local/bin/wmenu-video
bind=Shift+Alt,O,spawn,$HOME/.local/bin/wmenu-audio-output
bind=Shift+Alt,I,spawn,$HOME/.local/bin/wmenu-audio-input
bind=Shift+Alt,A,spawn,$HOME/.local/bin/wmenu-wiki
bind=Shift+Alt,R,spawn,$HOME/.local/bin/wmenu-audio-rec
bind=Shift+Alt,D,spawn,$HOME/.local/bin/qrdecode
bind=Shift+Alt,N,spawn,$HOME/.local/bin/wmenu-notes
bind=Shift+Alt,G,spawn,$HOME/.local/bin/wmenu-game -r
bind=Shift+Alt,M,spawn,$HOME/.local/bin/wmenu-music
bind=Shift+Alt,T,spawn,$HOME/.local/bin/wmenu-timer -t
bind=Shift+Alt+Ctrl,T,spawn,$HOME/.local/bin/wmenu-timer -q
bind=Shift+Alt+Ctrl,P,spawn,passmenu --type

# media
bind=Alt,0,spawn,$HOME/.local/bin/set_wallpaper
bind=Alt,Slash,spawn,$HOME/.local/bin/toggle_dark_mode
bind=Alt,Equal,spawn,$HOME/.local/bin/volume up 5
bind=Alt,Minus,spawn,$HOME/.local/bin/volume down 5
bind=Alt,Grave,spawn,$HOME/.local/bin/volume toggle
bind=Shift+Alt,Equal,spawn_shell,mpc next && $HOME/.local/bin/notify
bind=Shift+Alt,Minus,spawn_shell,mpc prev && $HOME/.local/bin/notify
bind=Shift+Alt,Grave,spawn,mpc toggle
bind=Alt,BracketRight,spawn,$HOME/.local/bin/brightness up 10
bind=Alt,BracketLeft,spawn,$HOME/.local/bin/brightness down 10

# window operation
bind=SUPER,q,killclient,
bind=SUPER+Shift,q,quit
bind=SUPER+Ctrl,v,spawn,wtype $(wl-paste)
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER,N,focusstack,next
bind=SUPER,P,focusstack,prev
bind=SUPER+CTRL,N,exchange_stack_client,next
bind=SUPER+CTRL,P,exchange_stack_client,prev
bind=SUPER+SHIFT,R,setkeymode,resize
keymode=resize
bind=NONE,equal,resizewin,-10,+0
bind=NONE,minus,resizewin,+10,+0
bind=SHIFT,equal,resizewin,+0,+10
bind=SHIFT,minus,resizewin,+0,-10
bind=NONE,Escape,setkeymode,default
keymode=common
bind=SUPER+SHIFT,M,setkeymode,move
keymode=move
bind=NONE,H,movewin,-2,+0
bind=NONE,L,movewin,+2,+0
bind=NONE,J,movewin,+0,+2
bind=NONE,K,movewin,+0,-2
bind=NONE,C,centerwin
bind=NONE,U,spawn,$HOME/.local/bin/mango-movewindow topleft
bind=NONE,I,spawn,$HOME/.local/bin/mango-movewindow bottomleft
bind=NONE,O,spawn,$HOME/.local/bin/mango-movewindow topright
bind=NONE,P,spawn,$HOME/.local/bin/mango-movewindow bottomright
bind=NONE,Escape,setkeymode,default
keymode=common
bind=SUPER,I,minimized
bind=SUPER+SHIFT,I,restore_minimized

# workspace
bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0
bind=SUPER,U,viewtoright
bind=SUPER,I,viewtoleft
bind=Super+Ctrl,1,tag,1,0
bind=Super+Ctrl,2,tag,2,0
bind=Super+Ctrl,3,tag,3,0
bind=Super+Ctrl,4,tag,4,0
bind=Super+Ctrl,5,tag,5,0
bind=Super+Ctrl,6,tag,6,0
bind=Super+Ctrl,7,tag,7,0
bind=Super+Ctrl,8,tag,8,0
bind=Super+Ctrl,9,tag,9,0
bind=SUPER+CTRL,U,tagtoright
bind=SUPER+CTRL,I,tagtoleft
bind=Super+SHIFT,1,toggleview,1
bind=Super+SHIFT,2,toggleview,2
bind=Super+SHIFT,3,toggleview,3
bind=Super+SHIFT,4,toggleview,4
bind=Super+SHIFT,5,toggleview,5
bind=Super+SHIFT,6,toggleview,6
bind=Super+SHIFT,7,toggleview,7
bind=Super+SHIFT,8,toggleview,8
bind=Super+SHIFT,9,toggleview,9

# other
bind=SUPER,r,reload_config
bind=SUPER,v,togglefloating
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverview

# shot
bind=None,Print,spawn,$HOME/.local/bin/wmenu-shot
bind=Alt,Print,spawn,$HOME/.local/bin/wmenu-rec

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
